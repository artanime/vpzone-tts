name: Auditoria de seguridad

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Todos los lunes a las 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Vulnerabilidades en dependencias
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar pip-audit
        run: python -m pip install pip-audit

      - name: Auditar las dependencias instaladas
        run: python -m pip_audit --progress-spinner off
